lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # 12 h — ein Arbeitstag ohne Zwangs-Logout bei aktiver Nutzung.
    # Die eigentliche Inaktivitäts-Abmeldung (10 min) macht das Frontend.
    token_ttl: 43200
